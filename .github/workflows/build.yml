name: Build and Package Extension

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build

      - name: Package Extension (Zip dist)
        run: |
          cd dist
          zip -r ../form-filler-extension.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: form-filler-extension
          path: form-filler-extension.zip
